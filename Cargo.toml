[workspace]
resolver = "2"
members = [
    "crates/malus-core",
    "crates/malus-protocol",
    "crates/malus-provider-sdk",
    "crates/malus-daemon",
    "crates/malus-cli",
    "crates/malus-web-runtime",
    "providers/mock",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Malus Contributors"]
repository = "https://github.com/sea-deep/malus"

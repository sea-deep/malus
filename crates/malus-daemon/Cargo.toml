[package]
name = "malus-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
malus-core = { path = "../malus-core" }
malus-protocol = { path = "../malus-protocol" }
malus-apple = { path = "../malus-apple" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
malus-client = { path = "../malus-client" }
malus-cli = { path = "../malus-cli" }
tempfile = "3.17"

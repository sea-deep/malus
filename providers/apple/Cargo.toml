[package]
name = "malus-provider-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "malus-provider-apple"
path = "src/main.rs"

[dependencies]
malus-protocol = { path = "../../crates/malus-protocol" }
malus-provider-sdk = { path = "../../crates/malus-provider-sdk" }
malus-web-runtime = { path = "../../crates/malus-web-runtime" }
directories = "6.0"
tokio = { version = "1.43", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
